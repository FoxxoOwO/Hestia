services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hestia-backend:latest
    container_name: hestia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-hestia-super-secret-key-change-in-production-123456789}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/hestia.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hestia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hestia-frontend:latest
    container_name: hestia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hestia-network

networks:
  hestia-network:
    driver: bridge
